name: Scrambled Echo VST3 (macOS build + release)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["plugin/**", ".github/workflows/vst.yml"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DPF (same commit as plugin/build.py)
        run: |
          COMMIT=$(python3 -c "import re; print(re.search(r'DPF_COMMIT = \"(\w+)\"', open('plugin/build.py').read()).group(1))")
          git clone --filter=blob:none https://github.com/DISTRHO/DPF.git plugin/third_party/DPF
          git -C plugin/third_party/DPF checkout "$COMMIT"
          git -C plugin/third_party/DPF submodule update --init --depth 1

      - name: Build universal VST3 (x86_64 + arm64)
        env:
          CFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.15
          CXXFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.15
          LDFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.15
        run: make -C plugin/mac -j3

      - name: Ad-hoc sign and zip
        run: |
          B=plugin/dist/mac/ScrambledEcho.vst3
          lipo -archs "$B/Contents/MacOS/ScrambledEcho"
          codesign --force --deep --sign - "$B"
          codesign --verify --deep --strict "$B"
          ditto -c -k --keepParent "$B" ScrambledEcho-macos-universal-vst3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScrambledEcho-macos
          path: ScrambledEcho-macos-universal-vst3.zip

      - name: Publish release (macOS + Windows zips)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WIN=$(ls plugin/dist/ScrambledEcho-*-win64-vst3.zip | sort -V | tail -1)
          gh release view vst >/dev/null 2>&1 || \
            gh release create vst --title "Scrambled Echo VST3" --notes-file plugin/RELEASE_NOTES.md --latest
          gh release edit vst --notes-file plugin/RELEASE_NOTES.md
          gh release upload vst ScrambledEcho-macos-universal-vst3.zip "$WIN" --clobber
